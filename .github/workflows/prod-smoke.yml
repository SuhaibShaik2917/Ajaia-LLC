name: Production smoke test

# Optional: run the acceptance smoke test against the live deployment from CI.
# workflow_dispatch only appears once this file is on the default branch, which is
# why the first production run was executed as a Vercel build step instead
# (see README -> Deployment).
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL to test
        required: true
        default: https://docket-suhaibshaik2917.vercel.app

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run acceptance smoke test
        run: node scripts/smoke-prod.mjs "${{ inputs.base_url }}"
